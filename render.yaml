services:
  - type: web
    name: cvision-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: cvision-backend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_CONN_MAX_AGE
        value: 60
      - key: CORS_ALLOWED_ORIGINS
        value: https://cvision.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cvision.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 996039616861-t7vukaageedsklntm64k31o1aeu360vm.apps.googleusercontent.com
      - key: CV_ANALYZER_LOAD_BERT_NER
        value: false
      - key: CV_ANALYZER_BERT_NER_MODEL
        value: dslim/bert-base-NER
      - key: CV_ANALYZER_BERT_NER_DEVICE
        value: -1
      - key: CV_ANALYZER_NER_MIN_CONFIDENCE
        value: 0.85
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: REPORT_RECIPIENT_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: cvision
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cvision-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 996039616861-t7vukaageedsklntm64k31o1aeu360vm.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
